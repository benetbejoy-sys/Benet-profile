<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Benet // Profile</title>
<style>
:root{--bg:#050505;--panel:#120e05;--cy:#ffc933;--pk:#b8860b;--yl:#fff2b8;--tx:#f3ead2;--mu:#9a8a5c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Courier New",ui-monospace,Menlo,monospace;min-height:100vh;overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.35}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
main{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:28px 18px 60px}
.tag{color:var(--cy);font-size:12px;letter-spacing:3px}
h1{font-size:clamp(40px,13vw,68px);margin:6px 0;letter-spacing:4px;position:relative;color:var(--tx);text-shadow:0 0 12px var(--cy)}
h1:before,h1:after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;overflow:hidden}
h1:before{color:var(--pk);transform:translate(2px,0);clip-path:inset(0 0 55% 0);animation:g1 2.6s infinite steps(1)}
h1:after{color:var(--cy);transform:translate(-2px,0);clip-path:inset(55% 0 0 0);animation:g2 3.1s infinite steps(1)}
@keyframes g1{0%,90%,100%{transform:translate(0)}92%{transform:translate(4px,-2px)}95%{transform:translate(-3px,1px)}}
@keyframes g2{0%,85%,100%{transform:translate(0)}87%{transform:translate(-4px,2px)}93%{transform:translate(3px,-1px)}}
.role{font-size:17px;color:var(--yl);min-height:26px}
.cur{display:inline-block;width:9px;height:17px;background:var(--yl);vertical-align:-3px;margin-left:3px;animation:b 1s infinite}
@keyframes b{50%{opacity:0}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.stat{background:var(--panel);border:1px solid var(--cy);padding:12px 6px;text-align:center;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.stat b{display:block;font-size:26px;color:var(--cy)}
.stat span{font-size:11px;color:var(--mu);letter-spacing:1px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
nav button{flex:1 1 28%;background:transparent;color:var(--mu);border:1px solid #4a3a12;padding:11px 0;font:inherit;font-size:10px;letter-spacing:0;cursor:pointer;text-transform:uppercase}
nav button.on{color:#000;background:var(--pk);border-color:var(--pk);box-shadow:0 0 14px var(--pk)}
.pane{display:none;animation:in .35s}.pane.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.card{background:var(--panel);border-left:3px solid var(--pk);padding:14px 16px;margin-bottom:12px;cursor:pointer;transition:.2s}
.card:hover{border-color:var(--cy);box-shadow:0 0 16px rgba(255,201,51,.25)}
.card h3{margin:0;font-size:15px;color:var(--cy);display:flex;justify-content:space-between;gap:8px}
.card h3 i{color:var(--yl);font-style:normal;font-size:12px}
.card p{margin:0;max-height:0;overflow:hidden;color:var(--mu);font-size:14px;line-height:1.5;transition:max-height .3s,margin .3s}
.card.open p{max-height:200px;margin-top:10px}
.about{line-height:1.7;font-size:15px;background:var(--panel);padding:16px;border:1px solid #4a3a12}
.sk{margin-bottom:14px;font-size:13px}
.bar{height:8px;background:#2a2108;margin-top:6px}
.bar div{height:100%;width:0;background:linear-gradient(90deg,var(--pk),var(--cy));box-shadow:0 0 8px var(--cy);transition:width 1.1s}
.lk{display:block;text-align:center;text-decoration:none;color:var(--tx);border:1px solid var(--cy);padding:14px;margin-bottom:12px;letter-spacing:2px;font-size:14px;text-transform:uppercase;transition:.2s;background:rgba(255,201,51,.05)}
.lk:hover,.lk:active{background:var(--cy);color:#000;box-shadow:0 0 20px var(--cy)}
.gt{display:flex;gap:8px;margin-bottom:14px}
.gt button,.gb,.dp button{background:transparent;color:var(--cy);border:1px solid var(--cy);padding:10px 14px;font:inherit;font-size:13px;letter-spacing:1px;cursor:pointer}
.gt button.on{background:var(--cy);color:#000}
.gb{display:block;margin:12px auto;color:var(--yl);border-color:var(--yl)}
#sn{display:block;margin:0 auto;width:100%;max-width:300px;aspect-ratio:1;border:2px solid var(--cy);box-shadow:0 0 18px rgba(255,201,51,.4);touch-action:none}
.gm{text-align:center;margin-top:10px;font-size:13px;color:var(--mu)}.gm b{color:var(--yl)}
.dp{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin-top:8px}
.dp button{padding:12px 0;font-size:18px;touch-action:manipulation}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:300px;margin:0 auto}
.pad{aspect-ratio:1;opacity:.35;cursor:pointer;transition:.15s}.pad.lit{opacity:1;box-shadow:0 0 28px currentColor}
.note{border:1px dashed var(--cy);padding:14px;margin:16px 0;color:var(--yl);font-size:14px;line-height:1.5;text-align:center}
footer{text-align:center;color:var(--mu);font-size:11px;margin-top:30px;letter-spacing:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<main>
  <div class="tag" id="tag"></div>
  <h1 id="name"></h1>
  <div class="role"><span id="role"></span><span class="cur"></span></div>
  <div class="stats" id="stats"></div>
  <nav id="nav"></nav>
  <section class="pane on" id="p-about"><div class="about" id="about"></div></section>
  <section class="pane" id="p-ach"></section>
  <section class="pane" id="p-skills"></section>
  <section class="pane" id="p-games">
    <div class="gt"><button class="on" data-g="snake">Cyber Snake</button><button data-g="sim">Neon Memory</button></div>
    <div id="g-snake"><canvas id="sn" width="300" height="300"></canvas>
      <div class="gm">SCORE <b id="sc">0</b> &middot; BEST <b id="bs">0</b></div>
      <button class="gb" id="sb">START</button>
      <div class="gm">Swipe the grid, use arrow keys, or tap below</div>
      <div class="dp"><span></span><button data-d="0,-1">&#9650;</button><span></span><button data-d="-1,0">&#9664;</button><button data-d="0,1">&#9660;</button><button data-d="1,0">&#9654;</button></div></div>
    <div id="g-sim" style="display:none"><div class="pads" id="pads"></div>
      <div class="gm" id="sm">Repeat the pattern. It gets longer each round.</div>
      <div class="gm">LEVEL <b id="lv">0</b> &middot; BEST <b id="lb">0</b></div>
      <button class="gb" id="sst">START</button></div>
  </section>
  <section class="pane" id="p-links"></section>
  <section class="pane" id="p-hire"></section>
  <footer>// SYSTEM ONLINE //</footer>
</main>
<script>
/* ====== EDIT YOUR DETAILS HERE ====== */
const ME = {
  name: "BENET",
  tag: "> USER_PROFILE.EXE",
  roles: ["IT Student", "Singer & Musician", "Creative Writer", "Code Apprentice"],
  about: "Hi, I'm Benet: a Bachelor of Information Technology student, a singer and musician, and a creative writer. I'm sharpening my craft in C, JavaScript and Python, and earning Claude certificates to strengthen my resume. This is where code meets creativity.",
  stats: [["3","LANGUAGES"],["2","CREATIVE ARTS"],["1","DEGREE"]],
  achievements: [
    {t:"Claude Certificates", y:"In progress", d:"Collecting certifications in AI to build a strong, future-ready resume."},
    {t:"Programming Journey", y:"Ongoing", d:"Mastering C, JavaScript and Python through hands-on practice and projects."},
    {t:"Music & Singing", y:"Ongoing", d:"A passionate vocalist and musician who loves performing and creating."},
    {t:"Creative Writing", y:"Ongoing", d:"Turning ideas into stories and words that connect with people."}
  ],
  skills: [["C",55],["JavaScript",60],["Python",60],["Singing",80],["Creative Writing",75]],
  services: [
    {t:"Creative Writing", d:"Stories, scripts, captions, blog posts and custom pieces written in your voice."},
    {t:"Video Editing", d:"Clean, engaging edits for reels, YouTube videos and personal projects."}
  ],
  links: [
    ["Instagram","https://www.instagram.com/benetmathew08/"],
    ["LinkedIn","https://www.linkedin.com/in/benet-bejoy-mathew-33946a442/"],
    ["GitHub","https://github.com/benetbejoy-sys"],
    ["Substack (My Writing)","https://substack.com/@bravomike08"],
    ["Email Me","mailto:benetbejoy@gmail.com"]
  ]
};
/* ===================================== */
const $=id=>document.getElementById(id);
$("tag").textContent=ME.tag;
$("name").textContent=ME.name;$("name").dataset.t=ME.name;
$("about").textContent=ME.about;
$("stats").innerHTML=ME.stats.map(s=>`<div class="stat"><b data-n="${parseInt(s[0])}" data-s="${s[0].replace(/[0-9]/g,'')}">0</b><span>${s[1]}</span></div>`).join("");
$("p-ach").innerHTML=ME.achievements.map(a=>`<div class="card"><h3>${a.t}<i>${a.y}</i></h3><p>${a.d}</p></div>`).join("");
$("p-skills").innerHTML=ME.skills.map(s=>`<div class="sk">${s[0]} <span style="float:right;color:var(--cy)">${s[1]}%</span><div class="bar"><div data-w="${s[1]}"></div></div></div>`).join("");
$("p-links").innerHTML=ME.links.map(l=>`<a class="lk" href="${l[1]}" target="_blank" rel="noopener">${l[0]}</a>`).join("");
document.querySelectorAll(".card").forEach(c=>c.onclick=()=>c.classList.toggle("open"));

/* hire me */
$("p-hire").innerHTML=ME.services.map(x=>`<div class="card open"><h3>${x.t}<i>OPEN FOR WORK</i></h3><p>${x.d}</p></div>`).join("")
 +`<div class="note">Pricing is flexible. Rates are set based on the level of service you need. Reach out and let's talk.</div>`
 +ME.links.filter(l=>l[0]!=="GitHub").map(l=>`<a class="lk" href="${l[1]}" target="_blank" rel="noopener">Contact via ${l[0].replace(" (My Writing)","")}</a>`).join("");

/* tabs */
const tabs=[["about","About"],["ach","Journey"],["skills","Skills"],["games","Games"],["links","Links"],["hire","Hire Me"]];
$("nav").innerHTML=tabs.map((t,i)=>`<button data-k="${t[0]}" class="${i?"":"on"}">${t[1]}</button>`).join("");
$("nav").onclick=e=>{const k=e.target.dataset.k;if(!k)return;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));
  document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.id==="p-"+k));
  if(k==="skills")setTimeout(()=>document.querySelectorAll(".bar div").forEach(b=>b.style.width=b.dataset.w+"%"),50);};

/* counters */
document.querySelectorAll("[data-n]").forEach(el=>{const n=+el.dataset.n;let i=0;
  const t=setInterval(()=>{i+=Math.max(1,Math.ceil(n/25));if(i>=n){i=n;clearInterval(t)}el.textContent=i+el.dataset.s},40)});

/* typewriter */
let ri=0,ci=0,del=false;
(function type(){const w=ME.roles[ri];$("role").textContent=w.slice(0,ci);
  if(!del&&ci===w.length){del=true;return setTimeout(type,1400)}
  if(del&&ci===0){del=false;ri=(ri+1)%ME.roles.length}
  ci+=del?-1:1;setTimeout(type,del?35:75)})();


/* game switcher */
document.querySelector(".gt").onclick=e=>{const g=e.target.dataset.g;if(!g)return;
  document.querySelectorAll(".gt button").forEach(b=>b.classList.toggle("on",b.dataset.g===g));
  $("g-snake").style.display=g==="snake"?"block":"none";$("g-sim").style.display=g==="sim"?"block":"none"};

/* snake */
const sn=$("sn"),sx=sn.getContext("2d"),G=15,C=20;let S,dir,nd,food,run=false,tm,score=0,best=0;
function put(){do{food={x:Math.random()*G|0,y:Math.random()*G|0}}while(S.some(s=>s.x==food.x&&s.y==food.y))}
function reset(){S=[{x:7,y:7},{x:6,y:7},{x:5,y:7}];dir=nd={x:1,y:0};score=0;$("sc").textContent=0;put()}
function draw(){sx.fillStyle="#0a0803";sx.fillRect(0,0,300,300);sx.shadowBlur=10;
  sx.fillStyle=sx.shadowColor="#b8860b";sx.fillRect(food.x*C+3,food.y*C+3,14,14);
  sx.fillStyle=sx.shadowColor="#ffc933";S.forEach(s=>sx.fillRect(s.x*C+1,s.y*C+1,18,18));sx.shadowBlur=0}
function step(){dir=nd;const h={x:S[0].x+dir.x,y:S[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=G||h.y>=G||S.some(s=>s.x==h.x&&s.y==h.y)){clearInterval(tm);run=false;$("sb").textContent="GAME OVER - RETRY";return}
  S.unshift(h);if(h.x==food.x&&h.y==food.y){score++;$("sc").textContent=score;if(score>best){best=score;$("bs").textContent=best}put()}else S.pop();draw()}
function turn(x,y){if(run&&!(x==-dir.x&&y==-dir.y))nd={x,y}}
$("sb").onclick=()=>{clearInterval(tm);reset();draw();run=true;$("sb").textContent="RESTART";tm=setInterval(step,130)};
addEventListener("keydown",e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m&&run){e.preventDefault();turn(...m)}});
document.querySelector(".dp").onclick=e=>{const d=e.target.dataset.d;if(d)turn(...d.split(",").map(Number))};
let tx,ty;sn.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
sn.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
  Math.abs(dx)>Math.abs(dy)?turn(dx>0?1:-1,0):turn(0,dy>0?1:-1)},{passive:true});
S=[{x:7,y:7},{x:6,y:7},{x:5,y:7}];dir=nd={x:1,y:0};put();draw();

/* neon memory */
const pc=["#b8860b","#ffc933","#fcee09","#e6a817"];let seq=[],pi=0,lock=true,lbest=0;
$("pads").innerHTML=pc.map((c,i)=>`<div class="pad" data-i="${i}" style="background:${c};color:${c}"></div>`).join("");
const pads=[...document.querySelectorAll(".pad")];
function flash(i){pads[i].classList.add("lit");setTimeout(()=>pads[i].classList.remove("lit"),320)}
function nextRound(){seq.push(Math.random()*4|0);lock=true;pi=0;$("lv").textContent=seq.length;$("sm").textContent="WATCH...";
  seq.forEach((v,k)=>setTimeout(()=>flash(v),650*(k+1)));
  setTimeout(()=>{lock=false;$("sm").textContent="YOUR TURN"},650*(seq.length+1))}
$("sst").onclick=()=>{seq=[];$("sst").textContent="RESTART";nextRound()};
$("pads").onclick=e=>{const i=e.target.dataset.i;if(i===undefined||lock||!seq.length)return;flash(+i);
  if(+i!==seq[pi]){lock=true;const sc=seq.length-1;if(sc>lbest){lbest=sc;$("lb").textContent=lbest}$("sm").textContent="WRONG! You reached level "+sc;seq=[];return}
  if(++pi===seq.length){lock=true;$("sm").textContent="NICE!";setTimeout(nextRound,800)}};

/* matrix rain */
const cv=$("fx"),cx=cv.getContext("2d");let cols,drops;
function size(){cv.width=innerWidth;cv.height=innerHeight;cols=Math.floor(cv.width/16);drops=Array(cols).fill(1)}
size();addEventListener("resize",size);
const chars="01アイウエオカキクケコ#<>/{}";
setInterval(()=>{cx.fillStyle="rgba(5,5,5,.12)";cx.fillRect(0,0,cv.width,cv.height);cx.font="14px monospace";
  drops.forEach((y,i)=>{cx.fillStyle=Math.random()>.9?"#b8860b":"#ffc933";
    cx.fillText(chars[Math.floor(Math.random()*chars.length)],i*16,y*16);
    drops[i]=y*16>cv.height&&Math.random()>.975?0:y+1})},55);
</script>
</body>
</html>
